<!-- list of categories -->
<div id="category-list" x-ref="category-list"
    x-show="!$store.ui.isMobile || $store.ui.showCategories" x-cloak
    >
    <div class="list" x-data="{
        creatingCategory: false,
        newCategoryName: '',
        saving: false,
        async save() {
            if (!this.newCategoryName.trim()) { this.cancel(); return; }
            this.saving = true;
            await $store.chat.newCategory(this.newCategoryName.trim());
            this.saving = false;
            this.creatingCategory = false;
            this.newCategoryName = '';
        },
        cancel() {
            if (this.saving) return;
            this.creatingCategory = false;
            this.newCategoryName = '';
        },
        handleBlur() {
            var self = this;
            setTimeout(function() {
                if (self.creatingCategory && self.newCategoryName.trim()) {
                    self.save();
                } else if (self.creatingCategory) {
                    self.cancel();
                }
            }, 150);
        }
    }">
        <button class="add-cat-btn" :disabled="$store.stream.state !== 'idle' || creatingCategory" @click="creatingCategory = true" title="New category">
            {% include 'svg/add.svg' %}
        </button>

        <template x-if="creatingCategory">
            <div class="item new-category-input">
                <span class="icon">
                    {% include 'svg/chat.svg' %}
                </span>
                <input
                    x-ref="newCategoryInput"
                    type="text"
                    placeholder="Category name"
                    x-model="newCategoryName"
                    @keydown.enter="save()"
                    @keydown.escape="cancel()"
                    @blur="handleBlur()"
                    class="rename-input"
                    x-init="$nextTick(() => $refs.newCategoryInput?.focus())"
                >
                <span class="item-actions" style="opacity: 1;">
                    <button @click="save()" class="action-btn save" title="Create">
                        {% include 'svg/checkmark.svg' %}
                    </button>
                    <button @click="cancel()" class="action-btn cancel" title="Cancel">
                        {% include 'svg/cross.svg' %}
                    </button>
                </span>
            </div>
        </template>

        <template x-for="category in $store.chat.categories" :key="category">
            <ul :class="{
                    'item': true,
                    'active': category == $store.chat.selectedCategory,
                    'disabled': $store.stream.state !== 'idle' && category !== $store.chat.selectedCategory,
                    'drop-candidate': $store.chat.draggedChatId && category !== $store.chat.draggedChatCategory,
                    'drop-target': $store.chat.dragHoverCategory === category && category !== $store.chat.draggedChatCategory
                }"
                @click="
                    if ($store.stream.state !== 'idle') { return }

                    $store.chat.selectCategory(category);
                    if ($store.ui.isMobile) {
                        await $store.ui.toggleMobileSidebarView();
                    }
                "
                @dragover.stop.prevent="$store.chat.draggedChatId && category !== $store.chat.draggedChatCategory && ($store.chat.dragHoverCategory = category)"
                @dragleave="if (!$el.contains($event.relatedTarget) && $store.chat.dragHoverCategory === category) { $store.chat.dragHoverCategory = null }"
                @drop.prevent="$store.chat.dropChatOnCategory(category)"
            >
                <span class="icon">
                    <template x-if="category === 'general'">
                        {% include 'svg/home.svg' %}
                    </template>
                    <template x-if="category != 'general'">
                        {% include 'svg/chat.svg' %}
                    </template>
                </span>
                <span class="title" x-text="$store.chat.categoryLabel(category)"></span>
                <span class="count" x-show="$store.chat.categoryCounts[category]" x-text="$store.chat.categoryCounts[category]"></span>
            </ul>
        </template>
    </div>

    {% if login_enabled %}
        <div class="buttons">
            <!-- Logout button -->
            <button class="sidebar-btn" @click="if(confirm('Log out?')) window.location.href='/logout'">
                {% include 'svg/logout.svg' %}
                <span>Logout</span>
            </button>
        </div>
    {% endif %}
</div>

<!-- list of chats -->
<div id="chat-list" x-ref="chat-list" x-data="{query: ''}"
    x-show="!$store.ui.isMobile || $store.ui.showChatList" x-cloak
>
    <button class="header-btn" x-text="$store.chat.selectedCategory === 'general' ? 'General' : $store.chat.selectedCategory" x-show="$store.ui.isMobile" x-cloak @click="$store.ui.toggleMobileSidebarView()"></button>

    <div class="search">
        <input name="search" type="text" placeholder="Search chats" x-model="query">
    </div>

    <div class="chats">
        <div class="flex fullwidth">
            <template x-for="chat in $store.chat.visibleChats" :key="chat.id">
                <!-- only show if it matches the current category and search query -->
                <template
                    x-if="
                        chat.category === $store.chat.selectedCategory
                        &&
                        (chat.title || '').toLowerCase().includes(query.toLowerCase())
                    "
                >
                    <!-- give selected chats a nice border via the CSS class -->
                    <div
                        x-data="{
                            active: false,
                            renaming: false,
                            renameValue: '',
                            menuOpen: false,
                            startRename() {
                                this.menuOpen = false;
                                this.renaming = true;
                                this.renameValue = chat.title;
                                // the input lives in its own x-if scope, so $refs can't see it from here
                                this.$nextTick(() => {
                                    const input = document.querySelector(`#chat-${chat.id} .rename-input`);
                                    input?.focus();
                                    input?.select();
                                });
                            }
                        }"
                        @click.outside="menuOpen = false"
                        :id="`chat-${chat.id}`"
                        class="item"
                        :class="{
                            'active': chat.id === $store.chat.selectedChat,
                            'disabled': $store.stream.state !== 'idle' && chat.id !== $store.chat.selectedChat,
                            'renaming': renaming
                        }"
                        :draggable="$store.stream.state === 'idle' && !renaming"
                        @dragstart="$store.chat.draggedChatId = chat.id; $store.chat.draggedChatCategory = chat.category; $event.dataTransfer.effectAllowed = 'move'; $event.dataTransfer.setData('text/plain', chat.id)"
                        @dragend="$store.chat.draggedChatId = null; $store.chat.draggedChatCategory = null; $store.chat.dragHoverCategory = null"
                        @click="
                            if (!renaming) {
                                active = !active;
                                $store.chat.loadChat(chat.id);
                                if ($store.ui.isMobile) { $store.ui.showSidebar = false; }
                            }
                        "
                        x-init="
                            $nextTick(() => {
                                if (chat.id === $store.chat.selectedChat) {
                                    $el.scrollIntoView({ behavior: 'smooth' });
                                }
                            })
                        "
                    >
                        <div>
                            <template x-if="!renaming">
                                <div class="title-row">
                                    <span class="title" x-text="chat.title || 'New chat'"></span>
                                    <template x-if="chat.metadata?.meeting_room">
                                        <span class="chat-mic-badge" title="Meeting room">
                                            {% include 'svg/mic.svg' %}
                                        </span>
                                    </template>
                                    <!-- pointer devices: rename/delete fade in on hover or keyboard focus -->
                                    <div class="item-actions" @click.stop>
                                        <button class="action-btn" @click="startRename()" title="Rename" aria-label="Rename chat">
                                            {% include 'svg/edit.svg' %}
                                        </button>
                                        <button class="action-btn delete" @click="$store.chat.deleteChat(chat.id)" title="Delete" aria-label="Delete chat">
                                            {% include 'svg/trash.svg' %}
                                        </button>
                                    </div>
                                    <!-- touch devices have no hover: one menu button opens labelled actions -->
                                    <button class="action-btn item-menu-btn" @click.stop="menuOpen = !menuOpen" :aria-expanded="menuOpen" aria-label="Chat actions">
                                        {% include 'svg/kebab.svg' %}
                                    </button>
                                </div>
                            </template>

                            <span class="date" x-show="!renaming" x-text="formatDate(chat.updated) || 'No date known'"></span>
                            <template x-if="menuOpen && !renaming">
                                <div class="item-menu" @click.stop>
                                    <button @click="startRename()">
                                        {% include 'svg/edit.svg' %}
                                        <span>Rename</span>
                                    </button>
                                    <button class="delete" @click="menuOpen = false; $store.chat.deleteChat(chat.id)">
                                        {% include 'svg/trash.svg' %}
                                        <span>Delete</span>
                                    </button>
                                </div>
                            </template>
                            <template x-if="renaming">
                                <div class="rename-container">
                                    <input 
                                        x-ref="renameInput"
                                        type="text" 
                                        x-model="renameValue" 
                                        @keydown.enter="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''"
                                        @keydown.escape="renaming = false; renameValue = ''"
                                        @blur="setTimeout(() => { if (renaming) { renaming = false; renameValue = ''; } }, 150)"
                                        class="rename-input"
                                    >
                                    <button @click="if (renameValue.trim()) { $store.chat.renameChat(chat.id, renameValue.trim()); } renaming = false; renameValue = ''" class="rename-action-btn save" title="Save">
                                        {% include 'svg/checkmark.svg' %}
                                    </button>
                                    <button @click="renaming = false; renameValue = ''" class="rename-action-btn cancel" title="Cancel">
                                        {% include 'svg/cross.svg' %}
                                    </button>
                                </div>
                            </template>
                            
                            <template x-if="chat.tags?.length">
                                <ul class="tags">
                                    <template x-for="tag in chat.tags.slice(0,3)" :key="tag">
                                        <li x-text="tag" class="tag"></li>
                                    </template>
                                </ul>
                            </template>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- make sure there's always more chats than the viewport -->
        <template x-if="$store.chat.hasMoreChats">
            <div id="chat-scroll-loader" x-intersect="$store.chat.loadMoreChats()" class="item">loading more..</div>
        </template>
    </div>

    <div class="sidebar-bottom-actions">
        <button class="sidebar-btn new-chat-btn" @click="$store.chat.newChat()" :disabled="$store.stream.state !== 'idle'">
            {% include 'svg/add.svg' %}
            New Chat
        </button>
    </div>
</div>
