<div
    x-show="$store.upload.files.length > 0"
    id="upload-queue-container"
    class="upload-queue"
>
    <!-- Pending files -->
    <template x-if="$store.upload.files.length > 0">
        <div class="upload-section">
            <template x-for="(file, index) in $store.upload.files" :key="'pending-' + index">
                <div class="item">
                    <div class="file-info">
                        <span class="file-icon">
                            <template x-if="file.name.startsWith('pasted-image-')">
                                <span title="Pasted from clipboard">{% include 'svg/clipboard.svg' %}</span>
                            </template>
                            <template x-if="!file.name.startsWith('pasted-image-')">
                                <span title="File attachment">{% include 'svg/paperclip.svg' %}</span>
                            </template>
                        </span>
                        <span class="file-name" x-text="file.name"></span>
                    </div>
                    <button class="delete" @click="$store.upload.removeFile(index)" aria-label="Remove file">&times;</button>
                </div>
            </template>
        </div>
    </template>

    <!-- media attachments also land in the open site's media folder (opt-out) -->
    <label class="upload-site-target"
        x-show="$store.artifact.current && $store.upload.files.some(f => /^(image|video)\//.test(f.type))" x-cloak>
        <input type="checkbox" x-model="$store.artifact.saveAttachments">
        <span>Also add images to <strong x-text="$store.artifact.siteLabel($store.artifact.current)"></strong>/media so the AI can use them in the site</span>
    </label>
</div>
