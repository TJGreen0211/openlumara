<!-- drag and drop overlay -->
{% include 'chat/drop_overlay.html' %}

<!-- chat header -->
{% if config.get('enable_chat_header') %}
    {% include 'chat/header.html' %}
{% endif %}
{% if config.get('enable_chat_titlebar') %}
    {% include 'chat/titlebar.html' %}
{% endif %}

<!-- the main message view -->
<!-- not throttled: throttle drops the trailing event, so a momentum/bounce
     scroll that settles at the bottom could leave shouldScroll stale (and the
     scroll-to-bottom button showing). the check is cheap and Alpine only
     re-renders when the value actually flips -->
<div id="messages" x-ref="messages" x-cloak
    @scroll.passive="
        const el = $el;
        const distFromBottom = el.scrollHeight - el.scrollTop - el.clientHeight;
        $store.ui.shouldScroll = distFromBottom < $store.ui.scrollThreshold;
    "
>
    <!--
        a "turn" is:
            when it's a user turn:
                just one message which is the user's request

            when it's an AI turn:
                all messages emitted by the assistant after a user's request

                this can be reasoning (thinking), content, partial toolcalls, full toolcalls,
                tool responses, and so on.

        the grouping of raw messages into turns happens in the backend, in core/turn.py
        see that file for more information on how this works.

        any channel can use channel.group_stream() to get an array of grouped turns,
        just like what the webUI uses here!
    -->

    <!-- loading skeleton while switching to a chat that isn't cached yet
         (it fades in after a moment, so a fast load never flashes it) -->
    <template x-if="$store.chat.chatLoading">
        <div class="chat-skeleton" aria-busy="true" aria-label="Loading chat">
            <div class="skeleton-bubble user"></div>
            <div class="skeleton-bubble assistant"><span></span><span></span><span></span></div>
            <div class="skeleton-bubble user short"></div>
            <div class="skeleton-bubble assistant"><span></span><span></span></div>
        </div>
    </template>

    <!-- older turns render when this scrolls into view (see chat.renderOlderTurns) -->
    <div class="history-loader" x-show="$store.chat.renderStart > 0" x-intersect.margin.400px="$store.chat.renderOlderTurns()"></div>

    <!-- historical turns -->
    <!-- turns before $store.chat.renderStart stay unrendered (hidden, empty
         wrappers) until scrolled up to, so opening a long chat only renders
         its newest turns -->
    <!-- keyed by first_message_index (the turn's identity, also used by the
         delete/regenerate actions) so a mid-history delete does not rebind a
         reused DOM node's per-turn state (collapse toggles) to the wrong
         turn; turns pushed mid-stream lack the index and fall back to a
         string key, which cannot collide with the numeric message indices -->
    <template x-for="(turn, turnIndex) in $store.chat.turnHistory" :key="turn.first_message_index ?? 'pos' + turnIndex">
        <div class="fullwidth turn" :data-turn-index="turnIndex" x-show="turnIndex >= $store.chat.renderStart">
            <!-- user turn (always one message) -->
            <template x-if="turnIndex >= $store.chat.renderStart && turn.role === 'user' && !turn.messages[0]?._metadata?.signal">
                <div class="message-wrapper user" x-data="{ get message() { return turn.messages[0] } }">
                    <div class="message user">
                        {% include 'chat/turns/user.html' %}
                        <div x-data="{ get targetIndex() { return turn.first_message_index } }" class="fullwidth">
                            {% with buttons_role = 'user' %}{% include 'chat/message_buttons.html' %}{% endwith %}
                        </div>
                    </div>
                </div>
            </template>

            <!-- meeting boundary: a styled divider with no bubble and no message
                 buttons (regenerating from a divider would re-stream its text) -->
            <template x-if="turnIndex >= $store.chat.renderStart && turn.role === 'user' && turn.messages[0]?._metadata?.signal === 'MEETING_CUTOFF'">
                <div class="message-wrapper user" x-data="{ get message() { return turn.messages[0] } }">
                    {% include 'chat/turns/user.html' %}
                </div>
            </template>

            <!-- assistant turn (multiple messages combined into one bubble) -->
            <template x-if="turnIndex >= $store.chat.renderStart && turn.role === 'assistant'">
                <div class="message-wrapper assistant">
                    <div class="message assistant">
                        <!-- reasoning/tool runs are grouped into one collapsible "steps" row -->
                        <template x-for="(seg, segIndex) in groupTurnSteps(turn.messages)" :key="segIndex">
                            {% include 'chat/turns/assistant_history.html' %}
                        </template>

                        <div x-data="{ get targetIndex() { return turn.last_message_index } }" class="fullwidth">
                            {% with buttons_role = 'assistant' %}{% include 'chat/message_buttons.html' %}{% endwith %}
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

    <!-- streaming assistant turn -->
    <template x-if="$store.stream.turn.messages">
        <div class="message-wrapper assistant">
            <div class="message assistant">
                <template x-for="(seg, segIndex) in groupTurnSteps($store.stream.turn.messages, true)" :key="segIndex">
                    {% include 'chat/turns/assistant_stream.html' %}
                </template>

                <template x-if="$store.stream.state === 'processing_tools'">
                    {% include 'chat/prompt_processing.html' %}
                </template>

                <div x-data="{ get targetIndex() { return $store.stream.turn.first_message_index }, turn: {} }" class="fullwidth">
                    {% with buttons_role = 'assistant' %}{% include 'chat/message_buttons.html' %}{% endwith %}
                </div>
            </div>
        </div>
    </template>

    <!-- typing indicator -->
    <template x-if="$store.stream.state === 'message_sending' || $store.stream.state === 'message_received'">
        <div class="typing-indicator" id="typing" aria-label="AI is typing" x-ignore>
            <span></span><span></span><span></span>
        </div>
    </template>

    <!-- prompt processing indicator (works with llama.cpp and derivatives) -->
    <template x-if="$store.stream.state === 'processing'">
        {% include 'chat/prompt_processing.html' %}
    </template>
</div>

<!-- invisible upload form -->
{% include 'chat/upload.html' %}

<!-- input field -->
<div id="input">
    {% include 'chat/input.html' %}
</div>

<!-- "moved to category · undo" toast after dropping a chat on a category -->
<div id="move-toast" role="status" x-cloak x-show="$store.chat.moveToast" x-transition.opacity>
    <span>Moved to <strong x-text="$store.chat.categoryLabel($store.chat.moveToast?.toCategory)"></strong></span>
    <button @click="$store.chat.undoMove()" :disabled="$store.stream.state !== 'idle'">Undo</button>
</div>
