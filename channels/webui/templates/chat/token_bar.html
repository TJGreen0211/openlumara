<!-- context usage drawn as a progress border around the send/stop button (#send-wrap) -->
<div id="token-usage-bar" x-data="{
    get max() {
        return $store.system.data?.max_context || 0;
    },
    get percentage() {
        if (!this.max) return 0;
        return Math.min(($store.chat.currentTokenUsage / this.max) * 100, 100);
    },
    get label() {
        if (!this.max) return 'Context size unknown';
        return `${$store.chat.currentTokenUsage.toLocaleString()} / ${this.max.toLocaleString()} tokens (${this.percentage.toFixed(1)}%)`;
    }
}"
    :class="{
        'caution': percentage >= 75,
        'danger': percentage >= 90,
        'busy': $store.stream.state !== 'idle'
    }"
    role="meter"
    aria-label="Context usage"
    :aria-valuenow="Math.round(percentage)"
    aria-valuemin="0"
    aria-valuemax="100"
    :aria-valuetext="label"
>
    <!-- pathLength=100 lets the dash offset be the percentage directly -->
    <svg aria-hidden="true">
        <rect class="fill" pathLength="100"
            stroke-dasharray="100"
            :stroke-dashoffset="100 - percentage"></rect>
    </svg>
    <span class="tip" x-text="label"></span>
</div>
