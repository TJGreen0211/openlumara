<div class="flex fullwidth" x-data="{ get message() { return seg.message } }">
    <!-- Steps block (grouped reasoning + tool calls) -->
    <template x-if="seg.kind === 'steps'">
        {% include 'chat/steps.html' %}
    </template>

    <!-- Content block -->
    <template x-if="seg.kind === 'content'">
        <div class="content" x-html="renderMarkdown(message.content)"></div>
    </template>
</div>
